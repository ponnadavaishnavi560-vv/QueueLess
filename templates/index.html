<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QueueLess - Smart Queue Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>QueueLess</h1>
    <p>Smart Queue & Waiting Time Management</p>
</header>

<main>
    <section class="card">
        <h2>Join the Queue</h2>

        <form id="queueForm">
            <input type="text" id="name" placeholder="Enter your name" required>

            <select id="service" required>
                <option value="">Select a service</option>
                <option value="College Office">College Office</option>
                <option value="Canteen">Canteen</option>
                <option value="Library">Library</option>
                <option value="Hospital">Hospital</option>
            </select>

            <button type="submit">Get My Token</button>
        </form>

        <div id="tokenResult"></div>
    </section>

    <section class="card">
        <h2>Live Queue Status</h2>
        <div id="queueList">Loading queue...</div>
    </section>

    <section class="card">
        <h2>Staff Dashboard</h2>
        <button id="nextBtn">Call Next Token</button>
        <div id="adminMessage"></div>
    </section>
</main>

<footer>
    <p>QueueLess © 2026 | Smart Waiting, Better Living</p>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
